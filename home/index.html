<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home | ProtejaJA</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="pagina-rosa text-slate-900 antialiased min-h-screen flex flex-col">

    <nav class="bg-white/70 backdrop-blur border-b border-rose-100 sticky top-0 z-20">
        <div class="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between">
            <a href="index.html" class="text-xl font-extrabold text-rose-600 tracking-tight">Proteja<span class="text-slate-900">JA</span></a>
            <div class="flex items-center gap-4 text-sm font-medium text-slate-700">
                <a href="index.html" class="hover:text-rose-600">Home</a>
                <a href="/denuncias" class="hover:text-rose-600">Denúncias</a>
                <a href="/login" class="btn-rosa">Entrar</a>
            </div>
        </div>
    </nav>

    <main class="flex-1 flex flex-col items-center justify-center px-4">
        <section class="w-full max-w-2xl mx-auto text-center py-10">
            <div class="mb-8">
                <span class="badge-rosa inline-block mb-6">Versão estática da página home</span>
                <h1 class="text-4xl sm:text-6xl font-extrabold tracking-tight text-slate-900 mb-4">
                    Proteja<span class="text-rose-600">JA</span>
                </h1>
                <p class="text-lg text-slate-700 leading-relaxed">
                    Página inicial estática. Abra pelo servidor Flask
                    (<code class="bg-white px-1.5 py-0.5 rounded">http://127.0.0.1:5000/home</code>)
                    para usar cadastro, login, recuperação de senha e denúncias.
                </p>
            </div>

            <div class="flex flex-col sm:flex-row items-center justify-center gap-4">
                <a href="/cadastro" class="btn-rosa btn-grande w-full sm:w-auto">Criar conta</a>
                <a href="/login" class="btn-contorno btn-grande w-full sm:w-auto">Entrar</a>
            </div>
        </section>
    </main>

    <footer class="border-t border-rose-100 bg-white/50 mt-8">
        <div class="max-w-6xl mx-auto px-4 py-6 text-sm text-slate-500 text-center">
            ProtejaJA · Flask + SQLite + Tailwind CSS · Projeto Integrador
        </div>
    </footer>

    <script src="js/home.js"></script>
</body>
</html>
