{% extends "base.html" %}

{% block title %}Entrar | ProtejaJA{% endblock %}

{% block content %}
<section class="w-full max-w-md mx-auto py-10">
    <div class="card">
        <h1 class="text-2xl font-extrabold text-slate-900 text-center mb-1">Entrar</h1>
        <p class="text-sm text-slate-500 text-center mb-6">Acesse sua conta para enviar denúncias.</p>

        <form method="POST" action="/login" class="space-y-4">
            <div>
                <label for="email" class="campo-label">E-mail</label>
                <input type="email" id="email" name="email" required
                       class="campo" placeholder="voce@exemplo.com" value="{{ request.form.get('email', '') }}">
            </div>
            <div>
                <label for="senha" class="campo-label">Senha</label>
                <input type="password" id="senha" name="senha" required
                       class="campo" placeholder="Sua senha">
            </div>

            <button type="submit" class="btn-rosa btn-grande w-full">Entrar</button>
        </form>

        <p class="text-sm text-slate-600 text-center mt-6">
            Esqueceu a senha?
            <a href="/recuperar" class="font-semibold text-rose-600 hover:text-rose-700 underline">Recuperar senha</a>
        </p>

        <p class="text-sm text-slate-600 text-center mt-2">
            Não tem conta?
            <a href="/cadastro" class="font-semibold text-rose-600 hover:text-rose-700">Cadastre-se</a>
        </p>
    </div>
</section>
{% endblock %}
