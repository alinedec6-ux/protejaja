{% extends "base.html" %}

{% block title %}Cadastro | ProtejaJA{% endblock %}

{% block content %}
<section class="w-full max-w-md mx-auto py-10">
    <div class="card">
        <h1 class="text-2xl font-extrabold text-slate-900 text-center mb-1">Criar conta</h1>
        <p class="text-sm text-slate-500 text-center mb-6">Preencha seus dados para começar a denunciar.</p>

        <form method="POST" action="/cadastro" class="space-y-4">
            <div>
                <label for="nome" class="campo-label">Nome completo</label>
                <input type="text" id="nome" name="nome" required
                       class="campo" placeholder="Seu nome completo" value="{{ request.form.get('nome', '') }}">
            </div>
            <div>
                <label for="email" class="campo-label">E-mail</label>
                <input type="email" id="email" name="email" required
                       class="campo" placeholder="voce@exemplo.com" value="{{ request.form.get('email', '') }}">
            </div>
            <div>
                <label for="data_nascimento" class="campo-label">Data de nascimento</label>
                <input type="date" id="data_nascimento" name="data_nascimento" required
                       class="campo" value="{{ request.form.get('data_nascimento', '') }}">
            </div>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                    <label for="cidade" class="campo-label">Cidade</label>
                    <input type="text" id="cidade" name="cidade" required
                           class="campo" placeholder="Sua cidade" value="{{ request.form.get('cidade', '') }}">
                </div>
                <div>
                    <label for="senha" class="campo-label">Senha</label>
                    <input type="password" id="senha" name="senha" required minlength="6"
                           class="campo" placeholder="Mínimo 6 caracteres">
                </div>
            </div>
            <div>
                <label for="endereco" class="campo-label">Endereço completo</label>
                <input type="text" id="endereco" name="endereco" required
                       class="campo" placeholder="Rua, número, bairro, CEP"
                       value="{{ request.form.get('endereco', '') }}">
            </div>

            <button type="submit" class="btn-rosa btn-grande w-full">Cadastrar</button>
        </form>

        <p class="text-sm text-slate-600 text-center mt-6">
            Já tem conta?
            <a href="/login" class="font-semibold text-rose-600 hover:text-rose-700">Entrar</a>
        </p>
    </div>
</section>
{% endblock %}
